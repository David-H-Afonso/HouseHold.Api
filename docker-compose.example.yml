services:
  household-api:
    build: .
    image: household-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DATABASE_PATH: /data/household.db
      DATA_PROTECTION_KEYS_PATH: /data/keys
      # Set JWT_SECRET_KEY and CORS_ALLOWED_ORIGINS through CasaOS/hosting secrets.
    volumes:
      # Persists DB and Data Protection keys.
      - household-data:/data
    ports:
      - "2001:8080"

volumes:
  household-data:
